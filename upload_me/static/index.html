<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Air Quality Predictor</title>
  <style>
    body{font-family:sans-serif;max-width:440px;margin:auto;padding:20px;background:#f4f6f8}
    label{font-size:14px;color:#444}
    input,button{width:100%;padding:12px;margin:4px 0 12px;font-size:16px;border-radius:8px;border:1px solid #ccc;box-sizing:border-box}
    button{background:#2563eb;color:#fff;border:none}
    #result{margin-top:16px;padding:16px;background:#fff;border-radius:8px;font-size:20px;text-align:center}
  </style>
</head>
<body>
  <h2>Air Quality Predictor</h2>
  <div id="form"></div>
  <label>Date</label>
  <input id="date" type="date">
  <button onclick="predict()">Predict</button>
  <div id="result">Result will appear here</div>

  <script>
    const FIELDS = ['CO(GT)','PT08.S1(CO)','C6H6(GT)','PT08.S2(NMHC)','NOx(GT)',
      'PT08.S3(NOx)','NO2(GT)','PT08.S4(NO2)','PT08.S5(O3)','T','RH'];

    document.getElementById("form").innerHTML = FIELDS.map((f, i) =>
      `<label>${f}</label><input id="f${i}" type="number" step="any" inputmode="decimal">`
    ).join("");

    async function predict() {
      const values = {};
      FIELDS.forEach((f, i) => values[f] = parseFloat(document.getElementById("f"+i).value));
      const d = new Date(document.getElementById("date").value);
      if (isNaN(d)) { alert("Please pick a date"); return; }
      values["day_of_month"] = d.getDate();
      values["month"] = d.getMonth() + 1;
      values["year"] = d.getFullYear();

      if (Object.values(values).some(isNaN)) { alert("Please fill all fields"); return; }

      const res = await fetch("/predict", {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({values})
      });
      const data = await res.json();
      document.getElementById("result").textContent =
        res.ok ? "Prediction: " + data.prediction : "Error: " + JSON.stringify(data.detail);
    }
  </script>
</body>
</html>
